<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="mailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Modern App Icon Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#mailBg)" />
  
  <!-- Envelope Icon (Amplop Surat) with Soft Shadow -->
  <g filter="url(#subtleGlow)">
    <!-- Base Envelope Body -->
    <rect x="12" y="19" width="40" height="27" rx="4" fill="#ffffff" />
    
    <!-- Subtle Inner Fold Texture -->
    <path d="M13 45 L27 32 M51 45 L37 32" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
    
    <!-- Top Envelope Flap -->
    <path d="M12.5 20.5 L29.9 33.5 C31.2 34.5 32.8 34.5 34.1 33.5 L51.5 20.5" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Small Sarpras Badge Dot -->
    <circle cx="32" cy="23" r="2.2" fill="#2563eb" />
  </g>
</svg>