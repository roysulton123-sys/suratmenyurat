name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Components
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "❌ APK build failed! Showing last 120 lines of build log:"
            tail -n 120 ../build.log
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../SuratSarpras.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuratSarpras-Android-App
          path: SuratSarpras.apk

      - name: Create or Update GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Surat Sarpras Android APK (Terbaru)"
          body: "File APK aplikasi Surat Sarpras siap diunduh dan dipasang di smartphone Android."
          draft: false
          prerelease: false
          files: |
            SuratSarpras.apk
            build.log
